# d77void additions on top of the DMS-generated config.conf. `dms setup`
# rewrites config.conf (keeping a .backup copy) but never touches this file;
# if the d77 autostart or rules go missing after a setup, add
# `source=./d77.conf` back at the end of config.conf.
#
# Gaps, borders, colors, input and outputs are left to the dms/ fragments,
# which DMS regenerates from its settings: setting them here would override
# whatever is changed in DMS.

# Environment
env=XCURSOR_SIZE,24
env=QT_QPA_PLATFORM,wayland;xcb
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_QPA_PLATFORMTHEME_QT6,gtk3
env=TERMINAL,kitty

# Autostart. Mango doesn't run XDG autostart, so pipewire and friends are
# spawned here; dms itself is started from config.conf.
exec_once=pipewire
exec_once=udiskie -at
exec_once=dcal run --session --hidden
exec_once=xdg-user-dirs-update
exec_once=xdg-user-dirs-gtk-update
exec_once=~/./.auto.sh

# Window effects
focused_opacity=1.0
unfocused_opacity=0.9
shadows=1
shadow_only_floating=1
shadows_size=10
shadows_blur=15

# Animations
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-stack layout
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Overview
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
cursor_size=24
drag_tile_to_tile=1

# Keyboard
repeat_rate=25
repeat_delay=600

# Every tag starts in the tile layout
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Window rules
window_rule=no_border:1,app_id:^org\.gnome\.
window_rule=no_border:1,app_id:^org\.wezfurlong\.wezterm$
window_rule=no_border:1,app_id:^Alacritty$
window_rule=no_border:1,app_id:^com\.mitchellh\.ghostty$
window_rule=no_border:1,app_id:^kitty$
window_rule=is_floating:1,app_id:^d77run$
window_rule=is_floating:1,app_id:^qt-sudo$
window_rule=is_floating:1,app_id:^nmtui-float$
# DMS dialogs float; DMS 2 uses the dev.duxlabs.shell app id, older
# releases com.danklinux.dms
window_rule=is_floating:1,app_id:^(dev\.duxlabs\.shell|com\.danklinux\.dms)$

# No animation on DMS layers
layer_rule=no_animation:1,layer_name:^dms
