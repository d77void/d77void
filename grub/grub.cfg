# Embedded in the EFI GRUB image. No usbms/usb_keyboard: they swap the
# firmware's USB access for GRUB's own drivers, which read the live kernel
# and initrd off a USB stick at a crawl (minutes on a MacBook Pro 2011);
# the firmware already handles the stick and the keyboard.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod ext2
insmod reiserfs
insmod ntfs
insmod hfsplus
insmod linux
insmod chain
# By label first: --file opens every filesystem on every disk to look for it.
search --label --no-floppy --set=voidlive VOID_LIVE
if [ -z "${voidlive}" ]; then
	search --file --no-floppy --set=voidlive "/boot/grub/grub_void.cfg"
fi
source "(${voidlive})/boot/grub/grub_void.cfg"
